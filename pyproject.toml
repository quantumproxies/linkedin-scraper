[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-linkedin-scraper"
version = "0.1.0"
description = "LinkedIn scraper for Python and the command line: public profiles, company pages and job listings for a role and location, as JSON or CSV. Free and open source; sign in with your QuanticData account, no LinkedIn login, proxies or headless browser to run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["linkedin-scraper", "linkedin", "linkedin-api", "linkedin-profile-scraper", "linkedin-company-scraper", "linkedin-jobs-scraper", "linkedin-jobs", "job-scraper", "jobs-api", "lead-generation", "recruiting", "web-scraping"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
linkedin-scraper = "quanticdata_linkedin_scraper.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/linkedin-profile-scraper-api/?utm_source=github&utm_medium=pypi&utm_campaign=linkedin-scraper"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/linkedin-scraper"
Issues = "https://github.com/quantumproxies/linkedin-scraper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_linkedin_scraper" = ["spec.json", "py.typed"]
